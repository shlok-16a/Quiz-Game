<!DOCTYPE html>
<html>
<head>
    <title>Make Quiz</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h1>Quiz Admin</h1>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-categories.html">Categories</a>
        <a href="admin-questions.html">Questions</a>
        <a class="active" href="admin-quizzes.html">Make Quiz</a>
        <a href="admin-upload.html">CSV Upload</a>
        <button type="button" class="secondary" onclick="adminLogout()">Logout</button>
    </aside>

    <main class="content">
        <div class="row" style="justify-content:space-between;">
            <h2>Make a Quiz</h2>
            <button type="button" onclick="showCreate()">+ New Quiz</button>
        </div>

        <div class="card" id="createCard" style="display:none;">
            <h3>Create Quiz</h3>
            <label>Title</label>
            <input id="title" placeholder="e.g. BGMI Weekly Challenge">

            <label>Category</label>
            <select id="categoryId"></select>

            <label>Total Questions (target)</label>
            <input id="questionCount" type="number" value="10" min="1">

            <label>Seconds per question</label>
            <input id="questionTimerSeconds" type="number" value="10" min="1">
            <p class="muted">Each question in this quiz gets this many seconds.</p>

            <label>Active From (IST)</label>
            <input id="startDate" type="datetime-local">

            <label>Active Until (IST)</label>
            <input id="endDate" type="datetime-local">
            <p class="muted">Enter times in IST. Players only see this quiz between these times.</p>

            <label>
                <input id="isActive" type="checkbox" style="width:auto;">
                Active (visible to players during schedule)
            </label>

            <br><br>
            <div class="row">
                <button type="button" onclick="createQuiz()">Create</button>
                <button type="button" class="secondary" onclick="hideCreate()">Cancel</button>
            </div>
        </div>

        <div id="list"></div>
    </main>
</div>

<script src="js/api.js"></script>
<script>
    requireAdmin();

    function showCreate() {
        document.getElementById("createCard").style.display = "block";
    }

    function hideCreate() {
        document.getElementById("createCard").style.display = "none";
    }

    function formatQuestionTimer(seconds) {
        const s = Number(seconds) || 0;
        return `${s} sec / question`;
    }

    async function loadCategories() {
        const categories = await apiGet("/api/Category");
        document.getElementById("categoryId").innerHTML =
            categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("")
            || `<option value="">No categories</option>`;
    }

    async function createQuiz() {
        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;

        if (!startDate || !endDate) {
            alert("Set both Active From and Active Until.");
            return;
        }

        if (startDate >= endDate) {
            alert("Active Until must be after Active From.");
            return;
        }

        const body = {
            title: document.getElementById("title").value.trim(),
            categoryId: Number(document.getElementById("categoryId").value),
            questionCount: Number(document.getElementById("questionCount").value),
            durationSeconds: Number(document.getElementById("questionTimerSeconds").value),
            isActive: document.getElementById("isActive").checked,
            startDate: istLocalToIso(startDate),
            endDate: istLocalToIso(endDate)
        };

        if (!body.categoryId) {
            alert("Select a category.");
            return;
        }

        try {
            const created = await apiSend("/api/QuizBuilder", "POST", body);
            hideCreate();
            window.location.href = `admin-quiz-edit.html?id=${created.id}`;
        } catch (err) {
            alert(err.message);
        }
    }

    async function toggleActive(id, isActive) {
        try {
            await apiSend(`/api/QuizBuilder/${id}/active`, "PUT", { isActive: !isActive });
            await loadQuizzes();
        } catch (err) {
            alert(err.message);
        }
    }

    async function deleteQuiz(id, title) {
        if (!confirm(`Delete quiz "${title}"?`)) return;
        try {
            await apiSend(`/api/QuizBuilder/${id}`, "DELETE");
            await loadQuizzes();
        } catch (err) {
            alert(err.message);
        }
    }

    function getQuizStatus(q) {
        const now = Date.now();
        const end = parseUtcDate(q.endDate);
        const start = parseUtcDate(q.startDate);

        if (end && now > end.getTime()) {
            return "🏁 Completed";
        }
        if (!q.isActive) {
            return "⏸ Inactive";
        }
        if (start && now < start.getTime()) {
            return "🕒 Scheduled";
        }
        return "✅ Active";
    }

    async function loadQuizzes() {
        const quizzes = await apiGet("/api/QuizBuilder");
        const list = document.getElementById("list");

        if (!quizzes.length) {
            list.innerHTML = `<div class="card muted">No quizzes yet. Create one to get started.</div>`;
            return;
        }

        list.innerHTML = quizzes.map(q => {
            const status = getQuizStatus(q);
            const isCompleted = status.includes("Completed");
            return `
            <div class="card">
                <h3>${q.title}</h3>
                <p>Category: <strong>${q.categoryName}</strong></p>
                <p>Questions: ${q.assignedQuestions} / ${q.questionCount}</p>
                <p>Timer: ${formatQuestionTimer(q.durationSeconds)}</p>
                <p>Active From: ${formatIst(q.startDate)}</p>
                <p>Active Until: ${formatIst(q.endDate)}</p>
                <p>Status: ${status}</p>
                <div class="row">
                    <button type="button" onclick="location.href='admin-quiz-edit.html?id=${q.id}'">Edit Questions</button>
                    ${isCompleted ? "" : `
                    <button type="button" class="secondary" onclick="toggleActive(${q.id}, ${q.isActive})">
                        ${q.isActive ? "Deactivate" : "Activate"}
                    </button>`}
                    <button type="button" class="danger" onclick="deleteQuiz(${q.id}, '${String(q.title).replace(/'/g, "\\'")}')">Delete</button>
                </div>
            </div>
        `;
        }).join("");
    }

    (async () => {
        await loadCategories();
        await loadQuizzes();
    })().catch(err => alert(err.message));
</script>
</body>
</html>
