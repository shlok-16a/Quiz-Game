<!DOCTYPE html>
<html>
<head>
    <title>Admin Questions</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h1>Quiz Admin</h1>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-categories.html">Categories</a>
        <a class="active" href="admin-questions.html">Questions</a>
        <a href="admin-quizzes.html">Make Quiz</a>
        <a href="admin-rankings.html">Rankings</a>
        <a href="admin-upload.html">CSV Upload</a>
        <button type="button" class="secondary" onclick="adminLogout()">Logout</button>
    </aside>

    <main class="content">
        <div class="row" style="justify-content:space-between; align-items:center;">
            <h2>Question Management</h2>
            <button type="button" onclick="openCreate()">+ Add Question</button>
        </div>

        <div class="card filters">
            <div>
                <label>Category</label>
                <select id="filterCategoryId">
                    <option value="">All</option>
                </select>
            </div>
            <div>
                <label>Search</label>
                <input id="filterSearch" placeholder="Search by question text or ID">
            </div>
            <div>
                <label>Difficulty</label>
                <select id="filterDifficulty">
                    <option value="">All</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
            <div>
                <label>Status</label>
                <select id="filterStatus">
                    <option value="">All</option>
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>
            <div style="align-self:end;">
                <button type="button" id="filterBtn">Filter</button>
            </div>
        </div>

        <div class="bulk-bar">
            <p id="resultCount" class="muted"></p>
            <div class="row">
                <span id="selectedCount" class="muted">0 selected</span>
                <button type="button" class="danger" id="deleteSelectedBtn" disabled>Delete Selected</button>
            </div>
        </div>

        <div class="card" id="editCard" style="display:none;">
            <h3 id="editCardTitle">Edit Question</h3>
            <input type="hidden" id="editId">

            <label>Question Text</label>
            <textarea id="questionText"></textarea>

            <label>Option 1</label>
            <input id="option1">

            <label>Option 2</label>
            <input id="option2">

            <label>Option 3</label>
            <input id="option3">

            <label>Correct Option (1-3)</label>
            <input id="correctOption" type="number" min="1" max="3" value="1">

            <label>Difficulty</label>
            <select id="editDifficulty">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>

            <label>Category</label>
            <select id="editCategoryId"></select>

            <br><br>
            <div class="row">
                <button type="button" onclick="saveQuestion()">Save</button>
                <button type="button" class="secondary" onclick="closeEdit()">Cancel</button>
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th class="col-check">
                            <input type="checkbox" id="selectAll" title="Select all">
                        </th>
                        <th>ID</th>
                        <th>Question &amp; Options</th>
                        <th>Category</th>
                        <th>Difficulty</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script>
    requireAdmin();

    let categories = [];
    let questionsById = {};
    let searchDebounceId = null;

    function scheduleSearchReload() {
        clearTimeout(searchDebounceId);
        searchDebounceId = setTimeout(() => {
            loadQuestions().catch(err => alert(err.message));
        }, 300);
    }

    function escapeHtml(text) {
        return String(text ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }

    function getSelectedIds() {
        return [...document.querySelectorAll(".row-check:checked")]
            .map(cb => Number(cb.value));
    }

    function updateSelectionUi() {
        const checks = [...document.querySelectorAll(".row-check")];
        const selected = checks.filter(cb => cb.checked).length;
        const selectAll = document.getElementById("selectAll");
        const deleteBtn = document.getElementById("deleteSelectedBtn");

        document.getElementById("selectedCount").innerText =
            `${selected} selected`;
        deleteBtn.disabled = selected === 0;

        if (!checks.length) {
            selectAll.checked = false;
            selectAll.indeterminate = false;
            return;
        }

        selectAll.checked = selected === checks.length;
        selectAll.indeterminate = selected > 0 && selected < checks.length;
    }

    async function loadCategories() {
        categories = await apiGet("/api/Category");

        document.getElementById("filterCategoryId").innerHTML =
            `<option value="">All</option>` +
            categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");

        document.getElementById("editCategoryId").innerHTML =
            categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    }

    async function loadQuestions() {
        const categoryId = document.getElementById("filterCategoryId").value;
        const search = document.getElementById("filterSearch").value.trim();
        const difficulty = document.getElementById("filterDifficulty").value;
        const status = document.getElementById("filterStatus").value;

        const params = new URLSearchParams();
        if (categoryId) params.append("categoryId", categoryId);
        if (search) params.append("search", search);
        if (difficulty) params.append("difficulty", difficulty);
        if (status !== "") params.append("isActive", status);

        const query = params.toString();
        const url = query ? `/api/Question?${query}` : "/api/Question";

        console.log("Filter request:", url);

        const questions = await apiGet(url);
        questionsById = {};
        questions.forEach(q => { questionsById[q.id] = q; });

        document.getElementById("resultCount").innerText =
            `Showing ${questions.length} question(s)` +
            (categoryId ? ` for selected category` : "");

        const rows = document.getElementById("rows");

        if (!questions.length) {
            rows.innerHTML = `<tr><td colspan="7" class="muted">No questions found.</td></tr>`;
            updateSelectionUi();
            return;
        }

        rows.innerHTML = questions.map(q => {
            const active = q.isActive !== false;
            const correct = Number(q.correctOption) || 0;
            const statusBadge = active
                ? `<span class="status-badge active">Active</span>`
                : `<span class="status-badge inactive">Inactive</span>`;
            const toggleBtn = active
                ? `<button type="button" class="secondary" data-active="false" data-id="${q.id}">Deactivate</button>`
                : `<button type="button" data-active="true" data-id="${q.id}">Activate</button>`;

            const optionsHtml = [1, 2, 3].map(n => {
                const text = q[`option${n}`] ?? "";
                const isCorrect = correct === n;
                return `<li class="${isCorrect ? "correct-option" : ""}">
                    <span class="opt-label">${n}.</span>${escapeHtml(text)}${isCorrect ? " ✓" : ""}
                </li>`;
            }).join("");

            return `
            <tr class="${active ? "" : "question-inactive"}">
                <td class="col-check">
                    <input type="checkbox" class="row-check" value="${q.id}">
                </td>
                <td>${q.id}</td>
                <td>
                    <div>${escapeHtml(q.questionText)}</div>
                    <ul class="question-options-list">${optionsHtml}</ul>
                </td>
                <td>${escapeHtml(q.categoryName)}</td>
                <td>${escapeHtml(q.difficulty)}</td>
                <td>${statusBadge}</td>
                <td class="row">
                    <button type="button" class="secondary" data-edit="${q.id}">Edit</button>
                    ${toggleBtn}
                    <button type="button" class="danger" data-delete="${q.id}">Delete</button>
                </td>
            </tr>`;
        }).join("");

        rows.querySelectorAll("[data-edit]").forEach(btn => {
            btn.onclick = () => openEdit(Number(btn.dataset.edit));
        });

        rows.querySelectorAll("[data-active]").forEach(btn => {
            btn.onclick = () => setQuestionActive(
                Number(btn.dataset.id),
                btn.dataset.active === "true"
            );
        });

        rows.querySelectorAll("[data-delete]").forEach(btn => {
            btn.onclick = () => deleteQuestion(Number(btn.dataset.delete));
        });

        rows.querySelectorAll(".row-check").forEach(cb => {
            cb.onchange = updateSelectionUi;
        });

        updateSelectionUi();
    }

    function openCreate() {
        document.getElementById("editCard").style.display = "block";
        document.getElementById("editCardTitle").innerText = "Add Question";
        document.getElementById("editId").value = "";
        document.getElementById("questionText").value = "";
        document.getElementById("option1").value = "";
        document.getElementById("option2").value = "";
        document.getElementById("option3").value = "";
        document.getElementById("correctOption").value = "1";
        document.getElementById("editDifficulty").value = "Easy";

        const filterCategory = document.getElementById("filterCategoryId").value;
        if (filterCategory) {
            document.getElementById("editCategoryId").value = filterCategory;
        } else if (categories.length) {
            document.getElementById("editCategoryId").value = categories[0].id;
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
        document.getElementById("questionText").focus();
    }

    function openEdit(id) {
        const q = questionsById[id];
        if (!q) return;

        document.getElementById("editCard").style.display = "block";
        document.getElementById("editCardTitle").innerText = "Edit Question";
        document.getElementById("editId").value = q.id;
        document.getElementById("questionText").value = q.questionText;
        document.getElementById("option1").value = q.option1;
        document.getElementById("option2").value = q.option2;
        document.getElementById("option3").value = q.option3;
        document.getElementById("correctOption").value = q.correctOption;
        document.getElementById("editDifficulty").value = q.difficulty || "Easy";
        document.getElementById("editCategoryId").value = q.categoryId;
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeEdit() {
        document.getElementById("editCard").style.display = "none";
    }

    async function saveQuestion() {
        const id = document.getElementById("editId").value;
        const body = {
            questionText: document.getElementById("questionText").value.trim(),
            option1: document.getElementById("option1").value.trim(),
            option2: document.getElementById("option2").value.trim(),
            option3: document.getElementById("option3").value.trim(),
            correctOption: Number(document.getElementById("correctOption").value),
            difficulty: document.getElementById("editDifficulty").value,
            categoryId: Number(document.getElementById("editCategoryId").value)
        };

        if (!body.questionText || !body.option1 || !body.option2 || !body.option3) {
            alert("Fill question text and all 3 options.");
            return;
        }

        if (!body.categoryId) {
            alert("Select a category.");
            return;
        }

        if (body.correctOption < 1 || body.correctOption > 3) {
            alert("Correct option must be 1, 2, or 3.");
            return;
        }

        try {
            if (id) {
                await apiSend(`/api/Question/${id}`, "PUT", body);
            } else {
                await apiSend("/api/Question", "POST", body);
            }
            closeEdit();
            await loadQuestions();
        } catch (err) {
            alert(err.message);
        }
    }

    async function deleteQuestion(id) {
        if (!confirm(`Delete question #${id}?`)) return;
        try {
            await apiSend(`/api/Question/${id}`, "DELETE");
            await loadQuestions();
        } catch (err) {
            alert(err.message);
        }
    }

    async function setQuestionActive(id, isActive) {
        const action = isActive ? "activate" : "deactivate";
        if (!confirm(`${isActive ? "Activate" : "Deactivate"} question #${id}?\n\nDeactivated questions stay in existing quizzes but won't be added to new ones.`)) {
            return;
        }

        try {
            await apiSend(`/api/Question/${id}/active`, "PUT", { isActive });
            await loadQuestions();
        } catch (err) {
            alert(err.message || `Unable to ${action} question.`);
        }
    }

    async function deleteSelected() {
        const ids = getSelectedIds();
        if (!ids.length) return;

        if (!confirm(`Delete ${ids.length} selected question(s)?`)) return;

        const deleteBtn = document.getElementById("deleteSelectedBtn");
        deleteBtn.disabled = true;

        try {
            await apiSend("/api/Question/bulk-delete", "POST", { ids });
            await loadQuestions();
        } catch (err) {
            alert(err.message);
            updateSelectionUi();
        }
    }

    document.getElementById("selectAll").onchange = (e) => {
        document.querySelectorAll(".row-check").forEach(cb => {
            cb.checked = e.target.checked;
        });
        updateSelectionUi();
    };

    document.getElementById("deleteSelectedBtn").onclick = () => deleteSelected();
    document.getElementById("filterBtn").onclick = () => loadQuestions();
    document.getElementById("filterCategoryId").onchange = () => loadQuestions();
    document.getElementById("filterDifficulty").onchange = () => loadQuestions();
    document.getElementById("filterStatus").onchange = () => loadQuestions();
    document.getElementById("filterSearch").oninput = () => scheduleSearchReload();
    document.getElementById("filterSearch").onkeydown = (e) => {
        if (e.key === "Enter") {
            clearTimeout(searchDebounceId);
            loadQuestions().catch(err => alert(err.message));
        }
    };

    (async () => {
        await loadCategories();
        await loadQuestions();
    })().catch(err => alert(err.message));
</script>
</body>
</html>
