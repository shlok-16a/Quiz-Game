<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quiz Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2 id="pageTitle">Quiz Login</h2>

<div class="role-row" id="roleRow">
    <label>
        <input type="radio" name="role" value="user" checked onchange="onRoleChange()">
        User
    </label>
    <label>
        <input type="radio" name="role" value="admin" onchange="onRoleChange()">
        Admin
    </label>
</div>

<br>

<div id="registerFields" style="display:none;">
    <input id="fullName" placeholder="Full Name">
    <br><br>
</div>

<input id="email" placeholder="Email" type="email">

<br><br>

<input id="password" type="password" placeholder="Password">

<br><br>

<button type="button" id="primaryBtn" onclick="submitAuth()">Login</button>

<p id="loginHint" class="muted">Player: use your registered email</p>

<p id="authSwitch" class="muted">
    <span id="authSwitchText">New player?</span>
    <a href="#" id="authSwitchLink" onclick="toggleAuthMode(event)">Register here</a>
</p>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
