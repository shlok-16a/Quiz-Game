<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Categories</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h1>Quiz Admin</h1>
        <a href="admin-dashboard.html">Dashboard</a>
        <a class="active" href="admin-categories.html">Categories</a>
        <a href="admin-questions.html">Questions</a>
        <a href="admin-quizzes.html">Make Quiz</a>
        <a href="admin-rankings.html">Rankings</a>
        <a href="admin-upload.html">CSV Upload</a>
        <button class="secondary" onclick="adminLogout()">Logout</button>
    </aside>

    <main class="content">
        <div class="row" style="justify-content: space-between;">
            <h2>Quiz Categories</h2>
            <button onclick="toggleForm(true)">+ Add Category</button>
        </div>

        <div class="card" id="formCard" style="display:none;">
            <h3 id="formTitle">Add Category</h3>
            <input type="hidden" id="editId">

            <label>Category Name</label>
            <input id="name">

            <label>Description</label>
            <textarea id="description"></textarea>

            <label>Cover Image URL</label>
            <input id="coverImageUrl" placeholder="https://... or upload below">

            <label>Or upload cover image (max 2 MB)</label>
            <input id="coverImageFile" type="file" accept="image/jpeg,image/png,image/gif,image/webp,.jpg,.jpeg,.png,.gif,.webp">
            <p id="coverImageHint" class="muted" style="margin:6px 0 0;">JPG, PNG, GIF, or WEBP - under 2 MB</p>
            <div id="coverPreviewWrap" class="cover-preview-wrap" style="display:none;">
                <img id="coverPreview" class="cover-preview" alt="Cover preview">
                <button type="button" class="secondary" id="clearCoverBtn" style="margin-top:8px;">Clear image</button>
            </div>

            <label>Correct Points</label>
            <input id="correctPoints" type="number" value="10">

            <label>Wrong Points</label>
            <input id="wrongPoints" type="number" value="-5">

            <br><br>
            <div class="row">
                <button onclick="saveCategory()">Save</button>
                <button class="secondary" onclick="toggleForm(false)">Cancel</button>
            </div>
        </div>

        <div id="list"></div>
    </main>
</div>

<script src="js/api.js"></script>
<script>
    requireAdmin();
    let categoriesCache = [];
    let pendingCoverFile = null;
    const MAX_COVER_BYTES = 2 * 1024 * 1024;

    function resolveCoverUrl(url) {
        if (!url) return "";
        if (/^https?:\/\//i.test(url)) return url;
        return `${API_BASE_URL}${url.startsWith("/") ? "" : "/"}${url}`;
    }

    function showCoverPreview(url) {
        const wrap = document.getElementById("coverPreviewWrap");
        const img = document.getElementById("coverPreview");
        if (!url) {
            wrap.style.display = "none";
            img.removeAttribute("src");
            return;
        }
        img.src = resolveCoverUrl(url);
        wrap.style.display = "block";
    }

    function clearPendingCover() {
        pendingCoverFile = null;
        document.getElementById("coverImageFile").value = "";
    }

    function toggleForm(show, category = null) {
        document.getElementById("formCard").style.display = show ? "block" : "none";
        document.getElementById("formTitle").innerText = category ? "Edit Category" : "Add Category";
        document.getElementById("editId").value = category?.id || "";
        document.getElementById("name").value = category?.name || "";
        document.getElementById("description").value = category?.description || "";
        document.getElementById("coverImageUrl").value = category?.coverImageUrl || "";
        document.getElementById("correctPoints").value = category?.correctPoints ?? 10;
        document.getElementById("wrongPoints").value = category?.wrongPoints ?? -5;
        clearPendingCover();
        showCoverPreview(category?.coverImageUrl || "");
        document.getElementById("coverImageHint").innerText = "JPG, PNG, GIF, or WEBP - under 2 MB";
        document.getElementById("coverImageHint").className = "muted";
    }

    function getFormData() {
        return {
            name: document.getElementById("name").value.trim(),
            description: document.getElementById("description").value.trim(),
            coverImageUrl: document.getElementById("coverImageUrl").value.trim(),
            rulesText: "",
            correctPoints: Number(document.getElementById("correctPoints").value),
            wrongPoints: Number(document.getElementById("wrongPoints").value),
            questionCount: 10,
            questionTimerSeconds: 10,
            isActive: true
        };
    }

    async function uploadCoverIfNeeded() {
        if (!pendingCoverFile) {
            return document.getElementById("coverImageUrl").value.trim();
        }

        if (pendingCoverFile.size > MAX_COVER_BYTES) {
            throw new Error("Image must be smaller than 2 MB.");
        }

        const formData = new FormData();
        formData.append("file", pendingCoverFile);

        const response = await fetch(`${API_BASE_URL}/api/Category/upload-cover`, {
            method: "POST",
            body: formData
        });

        const text = await response.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { /* plain error text */ }

        if (!response.ok) {
            throw new Error((data && (data.title || data.message)) || text || "Upload failed");
        }

        return data.url || data.Url || "";
    }

    async function saveCategory() {
        const data = getFormData();
        if (!data.name) {
            alert("Category name is required.");
            return;
        }

        const id = document.getElementById("editId").value;

        try {
            data.coverImageUrl = await uploadCoverIfNeeded();
            if (id) await apiSend(`/api/Category/${id}`, "PUT", data);
            else await apiSend("/api/Category", "POST", data);
            toggleForm(false);
            await loadCategories();
        } catch (err) {
            alert(err.message);
        }
    }

    async function deleteCategory(id, name) {
        if (!confirm(`Delete category "${name}"?`)) return;
        try {
            await apiSend(`/api/Category/${id}`, "DELETE");
            await loadCategories();
        } catch (err) {
            alert(err.message);
        }
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }

    async function loadCategories() {
        categoriesCache = await apiGet("/api/Category");
        const list = document.getElementById("list");

        if (!categoriesCache.length) {
            list.innerHTML = `<div class="card muted">No categories yet.</div>`;
            return;
        }

        list.innerHTML = categoriesCache.map(c => {
            const cover = c.coverImageUrl
                ? `<img class="cover-thumb" src="${escapeHtml(resolveCoverUrl(c.coverImageUrl))}" alt="">`
                : `<div class="cover-thumb cover-thumb-empty muted">No cover</div>`;

            return `
            <div class="card">
                <div class="row" style="align-items:flex-start; gap:14px;">
                    ${cover}
                    <div style="flex:1; min-width:0;">
                        <h3 style="margin-top:0;">${escapeHtml(c.name)}</h3>
                        <p class="muted">${escapeHtml(c.description || "No description")}</p>
                        <p>Question Count : ${c.questionCount}</p>
                        <p>Timer : ${c.questionTimerSeconds} sec</p>
                        <p>+${c.correctPoints} / ${c.wrongPoints}</p>
                        <p>Status : ${c.isActive ? "Active" : "Inactive"}</p>
                        <div class="row">
                            <button class="secondary" onclick="editCategory(${c.id})">Edit</button>
                            <button class="danger" onclick="deleteCategory(${c.id}, '${String(c.name).replace(/'/g, "\\'")}')">Delete</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join("");
    }

    function editCategory(id) {
        const category = categoriesCache.find(c => c.id === id);
        if (!category) return;
        toggleForm(true, category);
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("coverImageFile").onchange = (e) => {
        const file = e.target.files?.[0] || null;
        const hint = document.getElementById("coverImageHint");

        if (!file) {
            pendingCoverFile = null;
            hint.innerText = "JPG, PNG, GIF, or WEBP - under 2 MB";
            hint.className = "muted";
            showCoverPreview(document.getElementById("coverImageUrl").value.trim());
            return;
        }

        if (file.size > MAX_COVER_BYTES) {
            pendingCoverFile = null;
            e.target.value = "";
            hint.innerText = "File is larger than 2 MB. Please choose a smaller image.";
            hint.className = "err";
            return;
        }

        if (!file.type.startsWith("image/")) {
            pendingCoverFile = null;
            e.target.value = "";
            hint.innerText = "Please select an image file.";
            hint.className = "err";
            return;
        }

        pendingCoverFile = file;
        hint.innerText = `${file.name} - ${(file.size / 1024).toFixed(0)} KB (will upload on Save)`;
        hint.className = "ok";
        showCoverPreview(URL.createObjectURL(file));
    };

    document.getElementById("clearCoverBtn").onclick = () => {
        clearPendingCover();
        document.getElementById("coverImageUrl").value = "";
        showCoverPreview("");
        document.getElementById("coverImageHint").innerText = "JPG, PNG, GIF, or WEBP - under 2 MB";
        document.getElementById("coverImageHint").className = "muted";
    };

    document.getElementById("coverImageUrl").oninput = (e) => {
        if (pendingCoverFile) return;
        showCoverPreview(e.target.value.trim());
    };

    loadCategories().catch(err => alert(err.message));
</script>
</body>
</html>
